<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1459a6">
  <title>Iniciar sesión · FMDMYE</title>
  <link rel="stylesheet" href="estilo-fmdmye.css">
</head>
<body class="login-page">
  <main class="login-container" aria-labelledby="login-title">
    <div class="brand-mark" aria-hidden="true">FM</div>
    <p class="eyebrow">FMDMYE · PORTAL DE GESTIÓN</p>
    <h1 id="login-title">Bienvenido</h1>
    <p class="intro">Accede para gestionar la información de tu asociación.</p>
    <div class="login-fields">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" placeholder="nombre@correo.com" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="Tu contraseña" autocomplete="current-password" required>
      <button type="button" id="loginBtn">Ingresar</button>
      <p id="message" class="form-message" role="alert" style="display: none;">Error al iniciar sesión.</p>
    </div>
    <p class="login-note">Usa las credenciales asignadas a tu cuenta.</p>
  </main>
  <script src="utilidades.js"></script>
  <script src="login.js"></script>
</body>
</html>
